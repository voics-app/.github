name: Bug report
description: Something in Discordy does not work as expected.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Never paste tokens, passwords or other secrets into an issue.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - api
        - gateway
        - messages
        - voice
        - client
        - admin
        - bots-sdk
        - contracts
        - gitops
        - docs
        - .github (CI workflows)
        - not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag, client version or commit SHA.
      placeholder: 0.1.0-dev.42
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - local (docker compose)
        - production (gen-serv)
        - other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the actual behaviour and any error output or logs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Log in as ...
        2. Open channel ...
        3. ...
    validations:
      required: true
  - type: checkboxes
    id: dod
    attributes:
      label: Definition of Done
      description: The issue is only done when every box applies. See docs/CONTRIBUTING.md#definition-of-done.
      options:
        - label: Code merged to develop through a reviewed PR, CI green (lint, tests, scan).
        - label: Tests added/updated; behaviour verified (live/e2e where it touches calls, delivery or deploys).
        - label: Documentation updated in the docs repo (runbooks, ADRs, specs, service docs) and in the repo README; the ops portal if an operator tool changed.
        - label: For platform / CI-CD items, the setup is updated too - Terraform (infra/terraform), bootstrap scripts, env.sh stages, cluster-config / env overlays (production and dev), Cloudflare host lists and the secrets inventory - so a new environment gets it automatically.
        - label: Board card moved to Done with a closing comment that says how it was verified.
