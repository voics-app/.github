name: Bug report
description: Something in Discordy does not work as expected.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Never paste tokens, passwords or other secrets into an issue.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - api
        - gateway
        - messages
        - voice
        - client
        - admin
        - bots-sdk
        - contracts
        - gitops
        - docs
        - .github (CI workflows)
        - not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag, client version or commit SHA.
      placeholder: 0.1.0-dev.42
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - local (docker compose)
        - production (gen-serv)
        - other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the actual behaviour and any error output or logs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Log in as ...
        2. Open channel ...
        3. ...
    validations:
      required: true
