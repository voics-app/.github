# Reusable secrets inventory check. Scans the caller's Kubernetes manifests for
#   - env[].valueFrom.secretKeyRef.key
#   - ExternalSecret spec.data[].secretKey and spec.data[].remoteRef.property
# and fails when one of those keys is not listed in the secrets inventory
# (`secrets/inventory.yaml` in voics-app/docs by default).
#
# A key counts as listed when it appears in the inventory as a mapping key or
# as a scalar value anywhere in the document, so the check does not depend on
# the inventory's exact schema. Files that are not valid YAML (e.g. Helm
# templates) are skipped with a warning.
name: secrets-inventory-check

on:
  workflow_call:
    inputs:
      inventory-path:
        description: "Path of the inventory file inside the inventory repository."
        required: false
        type: string
        default: "secrets/inventory.yaml"
      inventory-repository:
        description: "Repository (owner/name) that holds the inventory."
        required: false
        type: string
        default: "voics-app/docs"
      inventory-ref:
        description: "Git ref of the inventory repository."
        required: false
        type: string
        default: "main"
      manifests-path:
        description: "Directory in the calling repository to scan for manifests."
        required: false
        type: string
        default: "."
      runs-on:
        description: 'Runner label, or a JSON array of labels such as `["self-hosted","discordy"]`. The default (ubuntu-latest) follows the caller repo variable CI_RUNNER when set (scripts/pc-runner.sh).'
        required: false
        type: string
        default: "ubuntu-latest"
    secrets:
      inventory-token:
        description: "Token with read access to the inventory repository (needed when it is a different private repo)."
        required: false

permissions:
  contents: read

jobs:
  inventory:
    name: secrets-inventory-check
    runs-on: ${{ (inputs.runs-on == 'ubuntu-latest' && ((vars.CI_RUNNER != 'github' && vars.CI_RUNNER) || 'ubuntu-latest')) || (startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on)) || inputs.runs-on }}
    steps:
      - name: Checkout manifests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: manifests

      - name: Decide whether the inventory is reachable
        id: gate
        env:
          INVENTORY_REPOSITORY: ${{ inputs.inventory-repository }}
          THIS_REPOSITORY: ${{ github.repository }}
          HAS_TOKEN: ${{ secrets.inventory-token != '' }}
        run: |
          if [[ "$INVENTORY_REPOSITORY" != "$THIS_REPOSITORY" && "$HAS_TOKEN" != "true" ]]; then
            echo "::notice title=secrets inventory check skipped::the inventory repository is private and no inventory-token (DOCS_READ_TOKEN) is available"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout inventory
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.inventory-repository }}
          ref: ${{ inputs.inventory-ref }}
          token: ${{ secrets.inventory-token || github.token }}
          persist-credentials: false
          path: inventory
          sparse-checkout: ${{ inputs.inventory-path }}
          sparse-checkout-cone-mode: false

      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - if: steps.gate.outputs.run == 'true'
        run: python -m pip install --quiet "pyyaml>=6,<7"

      - name: Check secret keys against the inventory
        id: check
        if: steps.gate.outputs.run == 'true'
        shell: python
        env:
          INVENTORY_FILE: inventory/${{ inputs.inventory-path }}
          MANIFESTS_DIR: manifests/${{ inputs.manifests-path }}
          CHECKOUT_DIR: manifests
        run: |
          import os
          import pathlib
          import sys

          import yaml

          SKIP_DIRS = {".git", "node_modules", "target", "_build", "deps", "vendor"}


          def inventory_terms(node):
              if isinstance(node, dict):
                  for key, value in node.items():
                      yield str(key)
                      yield from inventory_terms(value)
              elif isinstance(node, list):
                  for item in node:
                      yield from inventory_terms(item)
              elif node is not None:
                  yield str(node)


          def secret_key_refs(node):
              if isinstance(node, dict):
                  ref = node.get("secretKeyRef")
                  if isinstance(ref, dict) and ref.get("key"):
                      yield "secretKeyRef", str(ref["key"])
                  for value in node.values():
                      yield from secret_key_refs(value)
              elif isinstance(node, list):
                  for item in node:
                      yield from secret_key_refs(item)


          def external_secret_keys(doc):
              if doc.get("kind") not in ("ExternalSecret", "ClusterExternalSecret"):
                  return
              spec = doc.get("spec") or {}
              if doc["kind"] == "ClusterExternalSecret":
                  spec = spec.get("externalSecretSpec") or {}
              for item in spec.get("data") or []:
                  if not isinstance(item, dict):
                      continue
                  if item.get("secretKey"):
                      yield "ExternalSecret.secretKey", str(item["secretKey"])
                  remote = item.get("remoteRef") or {}
                  if isinstance(remote, dict) and remote.get("property"):
                      yield "ExternalSecret.remoteRef.property", str(remote["property"])


          def manifest_files(root):
              for path in sorted(root.rglob("*")):
                  if path.suffix not in (".yaml", ".yml") or not path.is_file():
                      continue
                  if SKIP_DIRS.intersection(path.relative_to(root).parts):
                      continue
                  yield path


          def main():
              inventory_file = pathlib.Path(os.environ["INVENTORY_FILE"])
              manifests_dir = pathlib.Path(os.environ["MANIFESTS_DIR"])
              if not inventory_file.is_file():
                  print(f"::error::inventory file '{inventory_file}' not found")
                  return 1
              with inventory_file.open(encoding="utf-8") as handle:
                  listed = set()
                  for doc in yaml.safe_load_all(handle):
                      listed.update(inventory_terms(doc))

              checked = 0
              missing = []
              for path in manifest_files(manifests_dir):
                  try:
                      with path.open(encoding="utf-8") as handle:
                          docs = [d for d in yaml.safe_load_all(handle) if isinstance(d, dict)]
                  except yaml.YAMLError as error:
                      print(f"::warning file={path}::skipped, not valid YAML ({error.__class__.__name__})")
                      continue
                  for doc in docs:
                      refs = {key: kind for kind, key in [*secret_key_refs(doc), *external_secret_keys(doc)]}
                      for key, kind in refs.items():
                          checked += 1
                          if key not in listed:
                              missing.append((path, kind, key))

              checkout_dir = os.environ.get("CHECKOUT_DIR", ".")
              for path, kind, key in missing:
                  path = pathlib.Path(os.path.relpath(path, checkout_dir)).as_posix()
                  print(f"::error file={path},title=secret not in inventory::{kind} '{key}' is not listed in {inventory_file}")
              summary = f"### Secrets inventory: {checked} reference(s) checked, {len(missing)} missing\n"
              summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary_file:
                  with open(summary_file, "a", encoding="utf-8") as handle:
                      handle.write(summary)
              print(summary)
              return 1 if missing else 0


          sys.exit(main())
