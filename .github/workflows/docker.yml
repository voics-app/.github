# Reusable container image pipeline.
#
# build (buildx) -> Trivy scan (fails on CRITICAL) -> push to GHCR -> syft SBOM
# -> cosign keyless signature + SBOM attestation (SBOM and signing only on main, tags and explicit release versions).
#
# Image: <registry>/<owner>/<image-name>, e.g. ghcr.io/discordy-voics/api.
#
# Tags are derived from the git ref:
#   develop               -> X.Y.Z-dev.<run_number>
#   release/* , hotfix/*  -> X.Y.Z-rc.<run_number>
#   tag vX.Y.Z            -> X.Y.Z, X.Y, latest
#   tag vX.Y.Z-<pre>      -> X.Y.Z-<pre>
#   anything else         -> built and scanned, never pushed
# X.Y.Z comes from the branch name when it is release/X.Y.Z or hotfix/X.Y.Z,
# otherwise from the release-please manifest. The `version` input overrides all
# of this and publishes a stable release (use it with release-please outputs).
#
# Caller permissions: contents: read, packages: write, id-token: write.
name: docker

on:
  workflow_call:
    inputs:
      image-name:
        description: "Image name below the owner namespace: <repo>[-<component>], e.g. `api` or `voice-sfu`."
        required: true
        type: string
      description:
        description: "Human readable image description (OCI label org.opencontainers.image.description)."
        required: true
        type: string
      context:
        description: "Docker build context, relative to the repository root."
        required: false
        type: string
        default: "."
      dockerfile:
        description: "Path to the Dockerfile, relative to the repository root."
        required: false
        type: string
        default: "Dockerfile"
      target:
        description: "Optional multi-stage build target."
        required: false
        type: string
        default: ""
      build-args:
        description: "Newline separated KEY=value build arguments."
        required: false
        type: string
        default: ""
      platforms:
        description: "Comma separated platforms to publish, e.g. `linux/amd64,linux/arm64`."
        required: false
        type: string
        default: "linux/amd64"
      scan-platform:
        description: "Single platform that is built locally and scanned by Trivy before anything is pushed."
        required: false
        type: string
        default: "linux/amd64"
      registry:
        description: "Container registry host."
        required: false
        type: string
        default: "ghcr.io"
      version:
        description: "Explicit stable version (X.Y.Z or vX.Y.Z). Overrides ref-derived tags and publishes X.Y.Z, X.Y and latest."
        required: false
        type: string
        default: ""
      manifest-path:
        description: "release-please manifest that holds the current X.Y.Z."
        required: false
        type: string
        default: ".release-please-manifest.json"
      manifest-key:
        description: "Key inside the release-please manifest (the package path)."
        required: false
        type: string
        default: "."
      push:
        description: "Set to false to only build and scan, even on publishing refs."
        required: false
        type: boolean
        default: true
      trivy-severity:
        description: "Comma separated severities that fail the Trivy scan."
        required: false
        type: string
        default: "CRITICAL"
      trivy-ignore-unfixed:
        description: "Ignore vulnerabilities that have no fixed version yet."
        required: false
        type: boolean
        default: false
      runs-on:
        description: 'Runner label, or a JSON array of labels such as `["self-hosted","discordy"]`. The default (ubuntu-latest) follows the caller repo variable CI_RUNNER when set (scripts/pc-runner.sh).'
        required: false
        type: string
        default: "ubuntu-latest"
    secrets:
      build-secrets:
        description: "Optional newline separated `id=value` BuildKit secrets (e.g. a token for private git dependencies)."
        required: false
    outputs:
      version:
        description: "Computed image version."
        value: ${{ jobs.image.outputs.version }}
      image:
        description: "Fully qualified image name without tag."
        value: ${{ jobs.image.outputs.image }}
      digest:
        description: "Digest of the pushed image (empty when nothing was pushed)."
        value: ${{ jobs.image.outputs.digest }}
      published:
        description: "`true` when the image was pushed."
        value: ${{ jobs.image.outputs.published }}

permissions:
  contents: read

jobs:
  image:
    name: image (${{ inputs.image-name }})
    # Build, Trivy, SBOM and signing are heavy: develop, main, release/hotfix branches and tags only.
    if: github.event_name != 'pull_request'
    runs-on: ${{ (inputs.runs-on == 'ubuntu-latest' && (vars.CI_RUNNER || 'ubuntu-latest')) || (startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on)) || inputs.runs-on }}
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      SELF_HOSTED: ${{ inputs.runs-on != 'ubuntu-latest' || (vars.CI_RUNNER != '' && vars.CI_RUNNER != 'github') }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
      published: ${{ steps.meta.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # release tags are needed to derive the pre-release version

      - name: CI cache policy
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CI_CACHE: ${{ vars.CI_CACHE }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # on: persistent self-hosted caches (Trivy DB, preinstalled cosign) may be used.
          # clean: the image is built without any layer cache (cold build: CI_CACHE=off, label ci-no-cache, schedule).
          # Release images (main, tags) are compiled inside the Dockerfile from clean sources: layers are keyed by
          # their inputs and no persistent cargo target/ exists in the build (ADR-0022).
          on=true; why="persistent cache on"; cold=false
          if [[ "${CI_CACHE,,}" == off || "$EVENT" == schedule ]] || jq -e 'index("ci-no-cache")' >/dev/null <<< "${LABELS:-[]}"; then cold=true; fi
          if [[ "$RUNNER_ENVIRONMENT" != self-hosted ]]; then on=false; why="GitHub-hosted runner"
          elif [[ ! -d /cache || ! -w /cache ]]; then on=false; why="no writable /cache volume"
          elif [[ "$cold" == true ]]; then on=false; why="cold build (CI_CACHE=off, ci-no-cache label or scheduled run)"; fi
          clean=false; if [[ "$cold" == true ]]; then clean=true; fi
          # SBOM and signature only for releases (main, tags, explicit release version): not on develop/rc builds.
          attest=false; if [[ "$REF" == refs/heads/main || "$REF" == refs/tags/* || -n "$VERSION_INPUT" ]]; then attest=true; fi
          {
            echo "CI_CACHE_ON=$on"
            echo "CI_DOCKER_CLEAN=$clean"
            echo "CI_ATTEST=$attest"
            if [[ "$on" == true ]] && command -v trivy >/dev/null; then echo "CI_HAVE_TRIVY=true"; fi
            if [[ "$on" == true ]] && command -v cosign >/dev/null; then echo "CI_HAVE_COSIGN=true"; fi
            if [[ "$on" == true ]]; then echo "TRIVY_CACHE_DIR=/cache/trivy"
            elif [[ "$RUNNER_ENVIRONMENT" == self-hosted ]]; then echo "TRIVY_CACHE_DIR=$RUNNER_TEMP/trivy"; fi
          } >> "$GITHUB_ENV"
          echo "CI cache: on=$on clean-image-build=$clean ($why)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Derive version, tags and labels
        id: meta
        env:
          REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REGISTRY: ${{ inputs.registry }}
          IMAGE_NAME: ${{ inputs.image-name }}
          DESCRIPTION: ${{ inputs.description }}
          VERSION_OVERRIDE: ${{ inputs.version }}
          MANIFEST_PATH: ${{ inputs.manifest-path }}
          MANIFEST_KEY: ${{ inputs.manifest-key }}
          PUSH_ENABLED: ${{ inputs.push }}
        run: |
          set -euo pipefail

          stable_re='^([0-9]+)\.([0-9]+)\.([0-9]+)$'
          semver_re='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'

          # Base version for pre-release tags (-dev.N, -rc.N): the next patch after the latest vX.Y.Z git
          # tag (releases are cut as git tags), falling back to the release-please manifest.
          manifest_version() {
            local tag v
            tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
            if [[ -n "$tag" ]]; then
              v="${tag#v}"
              IFS=. read -r major minor patch <<< "$v"
              printf '%s.%s.%s' "$major" "$minor" "$((patch + 1))"
              return
            fi
            if [[ ! -f "$MANIFEST_PATH" ]]; then
              echo "::error::no vX.Y.Z git tag and no release-please manifest '$MANIFEST_PATH'; cannot derive X.Y.Z" >&2
              exit 1
            fi
            v="$(jq -r --arg key "$MANIFEST_KEY" '.[$key] // empty' "$MANIFEST_PATH")"
            if [[ ! "$v" =~ $stable_re ]]; then
              echo "::error::'$MANIFEST_PATH' key '$MANIFEST_KEY' holds '$v', expected X.Y.Z" >&2
              exit 1
            fi
            printf '%s' "$v"
          }

          publishable=true
          if [[ -n "$VERSION_OVERRIDE" ]]; then
            version="${VERSION_OVERRIDE#v}"
            if [[ ! "$version" =~ $stable_re ]]; then
              echo "::error::version input '$VERSION_OVERRIDE' is not X.Y.Z" >&2
              exit 1
            fi
          elif [[ "$REF" =~ ^refs/tags/v(.+)$ && "${BASH_REMATCH[1]}" =~ $semver_re ]]; then
            version="${REF#refs/tags/v}"
          elif [[ "$REF" == "refs/heads/develop" ]]; then
            version="$(manifest_version)-dev.${RUN_NUMBER}"
          elif [[ "$REF" =~ ^refs/heads/(release|hotfix)/v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[2]}-rc.${RUN_NUMBER}"
          elif [[ "$REF" =~ ^refs/heads/(release|hotfix)/ ]]; then
            version="$(manifest_version)-rc.${RUN_NUMBER}"
          else
            version="$(manifest_version)-ci.${RUN_NUMBER}"
            publishable=false
          fi

          publish=false
          if [[ "$PUSH_ENABLED" == "true" && "$publishable" == "true" && "$EVENT_NAME" != pull_request* ]]; then
            publish=true
          fi

          image="${REGISTRY}/${OWNER,,}/${IMAGE_NAME}"
          tags=("${image}:${version}")
          if [[ "$version" =~ $stable_re ]]; then
            tags+=("${image}:${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" "${image}:latest")
          fi

          delimiter="EOF_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "version=${version}"
            echo "image=${image}"
            echo "publish=${publish}"
            echo "scan-tag=${image}:scan-${RUN_NUMBER}"
            # Layer cache in the registry (shared by every runner and branch). Hosted runners use a
            # docker-container builder and export the full cache; the self-hosted `docker` driver cannot
            # export a registry cache, so it imports it and embeds an inline cache in the pushed image.
            if [[ "${CI_DOCKER_CLEAN:-false}" == "true" ]]; then
              # Clean build (cold or release): no layer cache is imported.
              echo "cache-from="
              if [[ "${SELF_HOSTED:-false}" == "true" ]]; then echo "cache-to=type=inline"
              else echo "cache-to=type=registry,ref=${image}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true"; fi
            elif [[ "${SELF_HOSTED:-false}" == "true" ]]; then
              echo "cache-from<<${delimiter}"
              echo "type=registry,ref=${image}:buildcache"
              echo "type=registry,ref=${image}:latest"
              echo "${delimiter}"
              echo "cache-to=type=inline"
            else
              echo "cache-from=type=registry,ref=${image}:buildcache"
              echo "cache-to=type=registry,ref=${image}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true"
            fi
            echo "tags<<${delimiter}"
            printf '%s\n' "${tags[@]}"
            echo "${delimiter}"
            echo "labels<<${delimiter}"
            echo "org.opencontainers.image.title=${IMAGE_NAME}"
            echo "org.opencontainers.image.description=${DESCRIPTION//$'\n'/ }"
            echo "org.opencontainers.image.source=${SOURCE_URL}"
            echo "org.opencontainers.image.version=${version}"
            echo "org.opencontainers.image.revision=${SHA}"
            echo "org.opencontainers.image.licenses=UNLICENSED"
            echo "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "${delimiter}"
            # GHCR shows title/description from OCI annotations on the index/manifest, not from config
            # labels (an attestation or multi-platform build wraps the image in an index).
            echo "annotations<<${delimiter}"
            for scope in index manifest; do
              echo "${scope}:org.opencontainers.image.title=${IMAGE_NAME}"
              echo "${scope}:org.opencontainers.image.description=${DESCRIPTION//$'\n'/ }"
              echo "${scope}:org.opencontainers.image.source=${SOURCE_URL}"
              echo "${scope}:org.opencontainers.image.version=${version}"
              echo "${scope}:org.opencontainers.image.revision=${SHA}"
              echo "${scope}:org.opencontainers.image.licenses=UNLICENSED"
            done
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

          echo "version=${version} publish=${publish}"
          printf 'tag: %s\n' "${tags[@]}"

      # Log in before the first build: the registry layer cache is read (and written) through GHCR.
      - name: Log in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: contains(inputs.platforms, ',') || inputs.platforms != inputs.scan-platform
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      # Self-hosted runners share one small VM: a buildkit container per job is too heavy there and times
      # out on the Docker socket. Use the host daemon's built-in builder (no buildkit container, local layer
      # cache survives between jobs); that driver cannot export a registry cache (inline cache only, see meta).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: ${{ env.SELF_HOSTED == 'true' && 'docker' || 'docker-container' }}

      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          build-args: ${{ inputs.build-args }}
          secrets: ${{ secrets.build-secrets }}
          platforms: ${{ inputs.scan-platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.scan-tag }}
          load: true
          push: false
          provenance: false
          cache-from: ${{ steps.meta.outputs.cache-from }}
          no-cache: ${{ env.CI_DOCKER_CLEAN == 'true' }}

      # Trivy from the self-hosted runner image with the vulnerability DB on the /cache volume (flock: the DB is
      # not safe to update from two jobs at once).
      - name: Trivy vulnerability scan (preinstalled)
        if: env.CI_HAVE_TRIVY == 'true'
        env:
          IMAGE_REF: ${{ steps.meta.outputs.scan-tag }}
          SEVERITY: ${{ inputs.trivy-severity }}
          IGNORE_UNFIXED: ${{ inputs.trivy-ignore-unfixed }}
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db:1,mirror.gcr.io/aquasec/trivy-java-db:1
        run: |
          set -euo pipefail
          mkdir -p "$TRIVY_CACHE_DIR"
          args=(image --severity "$SEVERITY" --exit-code 1 --format table --timeout 20m)
          if [[ "$IGNORE_UNFIXED" == true ]]; then args+=(--ignore-unfixed); fi
          flock "$TRIVY_CACHE_DIR/.lock" trivy "${args[@]}" "$IMAGE_REF"
      - name: Trivy vulnerability scan
        if: env.CI_HAVE_TRIVY != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.meta.outputs.scan-tag }}
          severity: ${{ inputs.trivy-severity }}
          ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}
          exit-code: "1"
          format: table
          # Self-hosted runners download the vulnerability DB slowly: the 5 minute default aborts the scan with
          # no output (api v0.6.0). Try GHCR first, fall back to the GCR mirror, and allow a longer download.
          timeout: 20m
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db:1,mirror.gcr.io/aquasec/trivy-java-db:1

      - name: Build and push
        id: push
        if: steps.meta.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          build-args: ${{ inputs.build-args }}
          secrets: ${{ secrets.build-secrets }}
          platforms: ${{ inputs.platforms }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          cache-from: ${{ steps.meta.outputs.cache-from }}
          cache-to: ${{ steps.meta.outputs.cache-to }}
          no-cache: ${{ env.CI_DOCKER_CLEAN == 'true' }}

      - name: Generate SBOM (syft)
        if: env.CI_ATTEST == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.meta.outputs.publish == 'true' && format('{0}@{1}', steps.meta.outputs.image, steps.push.outputs.digest) || steps.meta.outputs.scan-tag }}
          # Credentials make sbom-action pull from the registry; leave them out for the local scan image.
          registry-username: ${{ steps.meta.outputs.publish == 'true' && github.actor || '' }}
          registry-password: ${{ steps.meta.outputs.publish == 'true' && secrets.GITHUB_TOKEN || '' }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-${{ inputs.image-name }}.spdx.json
          upload-release-assets: "false"

      - name: Install cosign
        if: steps.meta.outputs.publish == 'true' && env.CI_ATTEST == 'true' && env.CI_HAVE_COSIGN != 'true'
        # Direct pinned download: sigstore/cosign-installer needs `envsubst`, absent from the self-hosted runner image.
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cosign"
          curl -fsSL --retry 3 -o "$HOME/.cosign/cosign" https://github.com/sigstore/cosign/releases/download/v3.0.6/cosign-linux-amd64
          echo "c956e5dfcac53d52bcf058360d579472f0c1d2d9b69f55209e256fe7783f4c74  $HOME/.cosign/cosign" | sha256sum -c -
          chmod +x "$HOME/.cosign/cosign"
          echo "$HOME/.cosign" >> "$GITHUB_PATH"

      - name: Sign image and attest SBOM (keyless)
        if: steps.meta.outputs.publish == 'true' && env.CI_ATTEST == 'true'
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE_REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE_REF"

      - name: Summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          PUBLISH: ${{ steps.meta.outputs.publish }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### ${IMAGE}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| version | \`${VERSION}\` |"
            echo "| published | ${PUBLISH} |"
            echo "| digest | \`${DIGEST:-n/a}\` |"
            echo ""
            echo "Tags:"
            while IFS= read -r tag; do echo "- \`${tag}\`"; done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
