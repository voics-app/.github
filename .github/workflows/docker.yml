# Reusable container image pipeline.
#
# build (buildx) -> Trivy scan (fails on CRITICAL) -> push to GHCR -> syft SBOM
# -> cosign keyless signature + SBOM attestation.
#
# Image: <registry>/<owner>/<image-name>, e.g. ghcr.io/discordy-voics/api.
#
# Tags are derived from the git ref:
#   develop               -> X.Y.Z-dev.<run_number>
#   release/* , hotfix/*  -> X.Y.Z-rc.<run_number>
#   tag vX.Y.Z            -> X.Y.Z, X.Y, latest
#   tag vX.Y.Z-<pre>      -> X.Y.Z-<pre>
#   anything else         -> built and scanned, never pushed
# X.Y.Z comes from the branch name when it is release/X.Y.Z or hotfix/X.Y.Z,
# otherwise from the release-please manifest. The `version` input overrides all
# of this and publishes a stable release (use it with release-please outputs).
#
# Caller permissions: contents: read, packages: write, id-token: write.
name: docker

on:
  workflow_call:
    inputs:
      image-name:
        description: "Image name below the owner namespace: <repo>[-<component>], e.g. `api` or `voice-sfu`."
        required: true
        type: string
      description:
        description: "Human readable image description (OCI label org.opencontainers.image.description)."
        required: true
        type: string
      context:
        description: "Docker build context, relative to the repository root."
        required: false
        type: string
        default: "."
      dockerfile:
        description: "Path to the Dockerfile, relative to the repository root."
        required: false
        type: string
        default: "Dockerfile"
      target:
        description: "Optional multi-stage build target."
        required: false
        type: string
        default: ""
      build-args:
        description: "Newline separated KEY=value build arguments."
        required: false
        type: string
        default: ""
      platforms:
        description: "Comma separated platforms to publish, e.g. `linux/amd64,linux/arm64`."
        required: false
        type: string
        default: "linux/amd64"
      scan-platform:
        description: "Single platform that is built locally and scanned by Trivy before anything is pushed."
        required: false
        type: string
        default: "linux/amd64"
      registry:
        description: "Container registry host."
        required: false
        type: string
        default: "ghcr.io"
      version:
        description: "Explicit stable version (X.Y.Z or vX.Y.Z). Overrides ref-derived tags and publishes X.Y.Z, X.Y and latest."
        required: false
        type: string
        default: ""
      manifest-path:
        description: "release-please manifest that holds the current X.Y.Z."
        required: false
        type: string
        default: ".release-please-manifest.json"
      manifest-key:
        description: "Key inside the release-please manifest (the package path)."
        required: false
        type: string
        default: "."
      push:
        description: "Set to false to only build and scan, even on publishing refs."
        required: false
        type: boolean
        default: true
      trivy-severity:
        description: "Comma separated severities that fail the Trivy scan."
        required: false
        type: string
        default: "CRITICAL"
      trivy-ignore-unfixed:
        description: "Ignore vulnerabilities that have no fixed version yet."
        required: false
        type: boolean
        default: false
      runs-on:
        description: 'Runner label, or a JSON array of labels such as `["self-hosted","discordy"]`.'
        required: false
        type: string
        default: "ubuntu-latest"
    secrets:
      build-secrets:
        description: "Optional newline separated `id=value` BuildKit secrets (e.g. a token for private git dependencies)."
        required: false
    outputs:
      version:
        description: "Computed image version."
        value: ${{ jobs.image.outputs.version }}
      image:
        description: "Fully qualified image name without tag."
        value: ${{ jobs.image.outputs.image }}
      digest:
        description: "Digest of the pushed image (empty when nothing was pushed)."
        value: ${{ jobs.image.outputs.digest }}
      published:
        description: "`true` when the image was pushed."
        value: ${{ jobs.image.outputs.published }}

permissions:
  contents: read

jobs:
  image:
    name: image (${{ inputs.image-name }})
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
      published: ${{ steps.meta.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Derive version, tags and labels
        id: meta
        env:
          REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REGISTRY: ${{ inputs.registry }}
          IMAGE_NAME: ${{ inputs.image-name }}
          DESCRIPTION: ${{ inputs.description }}
          VERSION_OVERRIDE: ${{ inputs.version }}
          MANIFEST_PATH: ${{ inputs.manifest-path }}
          MANIFEST_KEY: ${{ inputs.manifest-key }}
          PUSH_ENABLED: ${{ inputs.push }}
        run: |
          set -euo pipefail

          stable_re='^([0-9]+)\.([0-9]+)\.([0-9]+)$'
          semver_re='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'

          manifest_version() {
            if [[ ! -f "$MANIFEST_PATH" ]]; then
              echo "::error::release-please manifest '$MANIFEST_PATH' not found; it is needed to derive X.Y.Z" >&2
              exit 1
            fi
            local v
            v="$(jq -r --arg key "$MANIFEST_KEY" '.[$key] // empty' "$MANIFEST_PATH")"
            if [[ ! "$v" =~ $stable_re ]]; then
              echo "::error::'$MANIFEST_PATH' key '$MANIFEST_KEY' holds '$v', expected X.Y.Z" >&2
              exit 1
            fi
            printf '%s' "$v"
          }

          publishable=true
          if [[ -n "$VERSION_OVERRIDE" ]]; then
            version="${VERSION_OVERRIDE#v}"
            if [[ ! "$version" =~ $stable_re ]]; then
              echo "::error::version input '$VERSION_OVERRIDE' is not X.Y.Z" >&2
              exit 1
            fi
          elif [[ "$REF" =~ ^refs/tags/v(.+)$ && "${BASH_REMATCH[1]}" =~ $semver_re ]]; then
            version="${REF#refs/tags/v}"
          elif [[ "$REF" == "refs/heads/develop" ]]; then
            version="$(manifest_version)-dev.${RUN_NUMBER}"
          elif [[ "$REF" =~ ^refs/heads/(release|hotfix)/v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[2]}-rc.${RUN_NUMBER}"
          elif [[ "$REF" =~ ^refs/heads/(release|hotfix)/ ]]; then
            version="$(manifest_version)-rc.${RUN_NUMBER}"
          else
            version="$(manifest_version)-ci.${RUN_NUMBER}"
            publishable=false
          fi

          publish=false
          if [[ "$PUSH_ENABLED" == "true" && "$publishable" == "true" && "$EVENT_NAME" != pull_request* ]]; then
            publish=true
          fi

          image="${REGISTRY}/${OWNER,,}/${IMAGE_NAME}"
          tags=("${image}:${version}")
          if [[ "$version" =~ $stable_re ]]; then
            tags+=("${image}:${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" "${image}:latest")
          fi

          delimiter="EOF_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "version=${version}"
            echo "image=${image}"
            echo "publish=${publish}"
            echo "scan-tag=${image}:scan-${RUN_NUMBER}"
            echo "tags<<${delimiter}"
            printf '%s\n' "${tags[@]}"
            echo "${delimiter}"
            echo "labels<<${delimiter}"
            echo "org.opencontainers.image.title=${IMAGE_NAME}"
            echo "org.opencontainers.image.description=${DESCRIPTION//$'\n'/ }"
            echo "org.opencontainers.image.source=${SOURCE_URL}"
            echo "org.opencontainers.image.version=${version}"
            echo "org.opencontainers.image.revision=${SHA}"
            echo "org.opencontainers.image.licenses=UNLICENSED"
            echo "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

          echo "version=${version} publish=${publish}"
          printf 'tag: %s\n' "${tags[@]}"

      - name: Set up QEMU
        if: contains(inputs.platforms, ',') || inputs.platforms != inputs.scan-platform
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          build-args: ${{ inputs.build-args }}
          secrets: ${{ secrets.build-secrets }}
          platforms: ${{ inputs.scan-platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.scan-tag }}
          load: true
          push: false
          provenance: false
          cache-from: type=gha,scope=${{ inputs.image-name }}
          cache-to: type=gha,scope=${{ inputs.image-name }},mode=max

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.meta.outputs.scan-tag }}
          severity: ${{ inputs.trivy-severity }}
          ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}
          exit-code: "1"
          format: table

      - name: Log in to the registry
        if: steps.meta.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        if: steps.meta.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          build-args: ${{ inputs.build-args }}
          secrets: ${{ secrets.build-secrets }}
          platforms: ${{ inputs.platforms }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          cache-from: type=gha,scope=${{ inputs.image-name }}
          cache-to: type=gha,scope=${{ inputs.image-name }},mode=max

      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.meta.outputs.publish == 'true' && format('{0}@{1}', steps.meta.outputs.image, steps.push.outputs.digest) || steps.meta.outputs.scan-tag }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-${{ inputs.image-name }}.spdx.json
          upload-release-assets: "false"

      - name: Install cosign
        if: steps.meta.outputs.publish == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image and attest SBOM (keyless)
        if: steps.meta.outputs.publish == 'true'
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE_REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE_REF"

      - name: Summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          PUBLISH: ${{ steps.meta.outputs.publish }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### ${IMAGE}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| version | \`${VERSION}\` |"
            echo "| published | ${PUBLISH} |"
            echo "| digest | \`${DIGEST:-n/a}\` |"
            echo ""
            echo "Tags:"
            while IFS= read -r tag; do echo "- \`${tag}\`"; done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
