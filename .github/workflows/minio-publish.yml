# Uploads a build artifact into a MinIO bucket on the gen-serv cluster (the website, the invite page,
# desktop installers and their update feed).
#
# Runs on the in-cluster ARC runner scale set, which reaches MinIO on the cluster network. It reads the
# MinIO key from the one Secret its service account may get (voics-data/minio, Role
# discordy-runner-publish in gitops), so no MinIO key is stored in GitHub.
#
# Objects are synced (overwritten when changed) and never removed, so files other repositories publish into
# the same bucket (for example invite/index.html next to the website) survive. Files matching
# `short-cache` are given a 5-minute Cache-Control: Cloudflare otherwise caches them for hours and
# would keep serving the previous release.
name: minio-publish

on:
  workflow_call:
    inputs:
      artifact:
        description: "Name of the artifact (uploaded earlier in the same run) to publish."
        type: string
        required: true
      bucket:
        description: "Target bucket, e.g. discordy-site or discordy-updates."
        type: string
        required: true
      prefix:
        description: "Path inside the bucket (no leading or trailing slash). Empty = bucket root."
        type: string
        default: ""
      short-cache:
        description: "Space-separated file names (relative to the artifact root) served with max-age=300."
        type: string
        default: ""
      copies:
        description: "Space-separated src:dst pairs copied inside the target after upload, e.g. a stable 'latest' download name."
        type: string
        default: ""

permissions:
  contents: read

env:
  S5CMD_VERSION: 2.3.0
  MINIO_URL: http://minio.voics-data.svc.cluster.local:9000

jobs:
  publish:
    # ARC scale sets match on their name only.
    runs-on: discordy
    concurrency:
      group: minio-publish-${{ inputs.bucket }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: publish

      - name: Install s5cmd
        # MinIO no longer publishes the mc client (dl.min.io returns 410); s5cmd speaks plain S3.
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSL "https://github.com/peak/s5cmd/releases/download/v${S5CMD_VERSION}/s5cmd_${S5CMD_VERSION}_Linux-64bit.tar.gz"             | tar -xz -C "${RUNNER_TEMP}/bin" s5cmd
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Read the MinIO key from the cluster
        run: |
          sa=/var/run/secrets/kubernetes.io/serviceaccount
          secret="$(curl -fsS --cacert "${sa}/ca.crt" -H "Authorization: Bearer $(cat "${sa}/token")"             https://kubernetes.default.svc/api/v1/namespaces/voics-data/secrets/minio)"
          user="$(jq -r '.data.MINIO_ROOT_USER' <<<"${secret}" | base64 -d)"
          pass="$(jq -r '.data.MINIO_ROOT_PASSWORD' <<<"${secret}" | base64 -d)"
          echo "::add-mask::${pass}"
          {
            echo "AWS_ACCESS_KEY_ID=${user}"
            echo "AWS_SECRET_ACCESS_KEY=${pass}"
          } >> "${GITHUB_ENV}"

      - name: Upload
        env:
          BUCKET: ${{ inputs.bucket }}
          PREFIX: ${{ inputs.prefix }}
          SHORT_CACHE: ${{ inputs.short-cache }}
          COPIES: ${{ inputs.copies }}
          AWS_REGION: us-east-1
        run: |
          set -euo pipefail
          s3() { s5cmd --endpoint-url "${MINIO_URL}" "$@"; }
          dest="s3://${BUCKET}${PREFIX:+/${PREFIX}}"
          s3 sync publish/ "${dest}/"
          for f in ${SHORT_CACHE}; do
            s3 cp --cache-control "public, max-age=300" "publish/${f}" "${dest}/${f}"
          done
          for pair in ${COPIES}; do
            src="${pair%%:*}" dst="${pair#*:}"
            s3 cp --cache-control "public, max-age=300" "${dest}/${src}" "${dest}/${dst}"
          done
          {
            echo "### Published to \`${BUCKET}${PREFIX:+/${PREFIX}}\`"
            echo '```'
            s3 ls "${dest}/*" | tail -n 50
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
