# CI for this repository: actionlint over every workflow, the behavioural
# tests of the embedded scripts, and the git-flow guard on pull requests.
name: ci

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**", "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  gitflow:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/gitflow-guard.yml

  actionlint:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet "pyyaml>=6,<7"
      - run: python -m unittest discover -s tests -v

  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [actionlint, test]
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/release-please.yml
