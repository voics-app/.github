# CI for this repository: actionlint over every workflow, the behavioural
# tests of the embedded scripts, and the git-flow guard on pull requests.
name: ci

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitflow:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/gitflow-guard.yml

  actionlint:
    runs-on: ${{ (vars.CI_RUNNER != '' && vars.CI_RUNNER != 'github' && !startsWith(vars.CI_RUNNER, 'ubuntu-') && vars.CI_RUNNER) || 'vm-runner' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        # The binary, not `docker run -v`: on the self-hosted runners the Docker daemon is not on the same
        # filesystem as the job, so the bind mount is empty ("no project was found").
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  test:
    runs-on: ${{ (vars.CI_RUNNER != '' && vars.CI_RUNNER != 'github' && !startsWith(vars.CI_RUNNER, 'ubuntu-') && vars.CI_RUNNER) || 'vm-runner' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GitHub-hosted: tool-cache Python. Self-hosted (scripts/runner.sh image): the system python3 with
      # python3-yaml baked in; the tool-cache Python there cannot load libpython in test subprocesses.
      - if: runner.environment == 'github-hosted'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - if: runner.environment == 'github-hosted'
        run: python3 -m pip install --quiet "pyyaml>=6,<7"
      - run: python3 -m unittest discover -s tests -v

  runner-capability-probe:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'hotfix/vm-runner-default-')
    runs-on: vm-runner
    steps:
      - name: Check non-secret runner capabilities
        run: |
          if command -v gh >/dev/null 2>&1; then echo "gh=available"; else echo "gh=unavailable"; fi
          if test -r /var/run/secrets/kubernetes.io/serviceaccount/token; then echo "cluster_serviceaccount=present"; else echo "cluster_serviceaccount=absent"; fi
          if getent hosts minio.voics-data.svc.cluster.local >/dev/null 2>&1; then echo "cluster_dns=available"; else echo "cluster_dns=unavailable"; fi
