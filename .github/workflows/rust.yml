# Reusable Rust checks: rustfmt, clippy (warnings are errors), cargo test and
# cargo-audit.
#   GitHub-hosted runners: fmt, clippy, test and audit run as parallel jobs (Swatinem/rust-cache).
#   Self-hosted runners:   one fmt -> clippy -> test job (compile once) on the persistent /cache volume and the
#                          toolchains baked into the runner image (scripts/runner.sh); see ADR-0022.
# Cache switch: repo/org variable CI_CACHE=off (or the PR label `ci-no-cache`, or a scheduled run) makes the
# self-hosted job a clean from-scratch build. Release builds (main, tags, release/*, hotfix/*) never reuse a
# persistent cargo target/.
name: rust

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory that contains Cargo.toml (workspace root)."
        required: false
        type: string
        default: "."
      toolchain:
        description: "Rust toolchain to install."
        required: false
        type: string
        default: "1.99"
      clippy-args:
        description: "Arguments passed to `cargo clippy`."
        required: false
        type: string
        default: "--all-targets --all-features -- -D warnings"
      test-args:
        description: "Arguments passed to `cargo test`."
        required: false
        type: string
        default: "--all-features"
      audit:
        description: "Run cargo-audit against the RustSec advisory database."
        required: false
        type: boolean
        default: true
      audit-args:
        description: "Extra arguments for `cargo audit`, e.g. `--ignore RUSTSEC-YYYY-NNNN`."
        required: false
        type: string
        default: ""
      system-packages:
        description: "Space separated apt packages to install first (e.g. `cmake protobuf-compiler`)."
        required: false
        type: string
        default: ""
      services:
        description: "JSON object of service containers for the test job (same shape as `jobs.<id>.services`)."
        required: false
        type: string
        default: "{}"
      env:
        description: "JSON object of extra environment variables for every job."
        required: false
        type: string
        default: "{}"
      image-name:
        description: "Optional name shown in job titles (keeps the call signature uniform with docker.yml)."
        required: false
        type: string
        default: ""
      description:
        description: "Optional description written to the job summary."
        required: false
        type: string
        default: ""
      runs-on:
        description: 'Runner label, or a JSON array of labels such as `["self-hosted","discordy"]`. The default (ubuntu-latest) follows the caller repo variable CI_RUNNER when set (scripts/pc-runner.sh).'
        required: false
        type: string
        default: "ubuntu-latest"
    secrets:
      private-deps-token:
        description: "Optional token with read access to private discordy-voics repos (git dependencies such as the contracts crate)."
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Debug info as line tables only (backtraces keep file:line): measured on api `cargo test --no-run`, 4 jobs,
  # 106 s -> 63 s and target/ 13 GB -> 4.2 GB. Release builds (Docker images) are not affected.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # Tag builds: a vX.Y.Z tag points at the merge commit that main's CI already built and tested in full (clean,
  # ADR-0022). When that run is green, the checks are not repeated (the image job still builds and publishes the
  # version). No green main run for this commit (or the lookup fails) -> the checks run as usual.
  verified:
    name: ${{ inputs.image-name || 'rust' }} / already verified on main
    if: github.ref_type == 'tag'
    runs-on: ${{ (inputs.runs-on == 'ubuntu-latest' && ((vars.CI_RUNNER != 'github' && vars.CI_RUNNER) || 'ubuntu-latest')) || (startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on)) || inputs.runs-on }}
    permissions:
      actions: read
      contents: read
    outputs:
      done: ${{ steps.lookup.outputs.done }}
    steps:
      - id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -uo pipefail
          wf="${WORKFLOW_REF%@*}"; wf="${wf##*/}"
          run="$(gh api "repos/$REPO/actions/workflows/$wf/runs?head_sha=$SHA&branch=main&event=push&status=success&per_page=1" -q '.workflow_runs[0].html_url // empty' 2>/dev/null || true)"
          if [[ -n "$run" ]]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "### Checks skipped: commit $SHA already passed in full on main ($run)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
            echo "No green main run for $SHA: running the checks"
          fi

  # Self-hosted runners: fmt -> clippy -> test in one job, so the workspace compiles once and fails fast
  # (fmt is seconds, clippy catches most errors before the slow test build).
  check:
    name: ${{ inputs.image-name || 'rust' }} / fmt + clippy + test
    needs: verified
    if: ${{ !cancelled() && needs.verified.outputs.done != 'true' && (inputs.runs-on != 'ubuntu-latest' || (vars.CI_RUNNER != '' && vars.CI_RUNNER != 'github')) }}
    runs-on: ${{ (inputs.runs-on == 'ubuntu-latest' && ((vars.CI_RUNNER != 'github' && vars.CI_RUNNER) || 'ubuntu-latest')) || (startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on)) || inputs.runs-on }}
    services: ${{ fromJSON(inputs.services) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: CI cache policy
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CI_CACHE: ${{ vars.CI_CACHE }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          on=true; why="persistent cache on"
          if [[ "$RUNNER_ENVIRONMENT" != self-hosted ]]; then on=false; why="GitHub-hosted runner"
          elif [[ ! -d /cache || ! -w /cache ]]; then on=false; why="no writable /cache volume"
          elif [[ "${CI_CACHE,,}" == off ]]; then on=false; why="CI_CACHE=off"
          elif jq -e 'index("ci-no-cache")' >/dev/null <<< "${LABELS:-[]}"; then on=false; why="PR label ci-no-cache"
          elif [[ "$EVENT" == schedule ]]; then on=false; why="scheduled cold build"
          fi
          # A persistent cargo target/ is only ever reused on pull requests and develop pushes. Releases
          # (main, tags, release/*, hotfix/*, PRs into main) always compile from scratch (ADR-0022).
          reuse=false
          if [[ "$on" == true ]]; then
            if [[ "$EVENT" == pull_request* && "$BASE_REF" != main && ! "$HEAD_REF" =~ ^(release|hotfix)/ ]]; then reuse=true
            elif [[ "$EVENT" == push && "$REF" == refs/heads/develop ]]; then reuse=true; fi
          fi
          {
            echo "CI_CACHE_ON=$on"
            echo "CI_REUSE_TARGET=$reuse"
            if [[ "$RUNNER_ENVIRONMENT" == self-hosted && "$on" != true ]]; then
              # Cold build: nothing persisted in the image or the volume is used (toolchain installed from scratch).
              echo "CARGO_HOME=$RUNNER_TEMP/cargo-home"
              echo "RUSTUP_HOME=$RUNNER_TEMP/rustup-home"
            fi
          } >> "$GITHUB_ENV"
          echo "CI cache: on=$on reuse-target=$reuse ($why)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Prepare environment
        env:
          SYSTEM_PACKAGES: ${{ inputs.system-packages }}
          EXTRA_ENV: ${{ inputs.env }}
          DEPS_TOKEN: ${{ secrets.private-deps-token }}
        run: |
          set -euo pipefail
          if [[ -n "$SYSTEM_PACKAGES" ]]; then
            read -ra packages <<< "$SYSTEM_PACKAGES"
            if ! dpkg -s "${packages[@]}" >/dev/null 2>&1; then
              SUDO=""; if command -v sudo >/dev/null && [ "$(id -u)" != 0 ]; then SUDO=sudo; fi
              $SUDO apt-get update -qq
              $SUDO apt-get install -y -qq --no-install-recommends "${packages[@]}"
            fi
          fi
          jq -r 'to_entries[] | "\(.key)<<__ENV_EOF__\n\(.value)\n__ENV_EOF__"' <<< "$EXTRA_ENV" >> "$GITHUB_ENV"
          if [[ -n "$DEPS_TOKEN" ]]; then
            git config --global url."https://x-access-token:${DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
            git config --global --add url."https://x-access-token:${DEPS_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
            echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
          fi
      # Toolchain baked into the runner image: use it and skip the download (cold builds install it fresh).
      - name: Toolchain from the runner image
        id: tc
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          set -euo pipefail
          if [[ "$CI_CACHE_ON" == true ]] && command -v rustup >/dev/null \
             && rustup toolchain list | grep -qE "^${TOOLCHAIN//./\\.}(-|$)" \
             && rustup component list --installed --toolchain "$TOOLCHAIN" | grep -q '^clippy' \
             && rustup component list --installed --toolchain "$TOOLCHAIN" | grep -q '^rustfmt'; then
            rustup default "$TOOLCHAIN"
            echo "have=true" >> "$GITHUB_OUTPUT"
            echo "using preinstalled toolchain $TOOLCHAIN"
          fi
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        if: steps.tc.outputs.have != 'true'
        with:
          toolchain: ${{ inputs.toolchain }}
          components: clippy, rustfmt
      - name: fmt, clippy, test
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
          CLIPPY_ARGS: ${{ inputs.clippy-args }}
          TEST_ARGS: ${{ inputs.test-args }}
          EVENT_NAME: ${{ github.event_name }}
          WORKDIR: ${{ inputs.working-directory }}
          EXTRA_ENV: ${{ inputs.env }}
        run: |
          set -euo pipefail
          if [[ "$CI_CACHE_ON" == true ]]; then
            export CARGO_HOME=/cache/cargo   # registry + git downloads: safe to reuse everywhere (cargo locks it)
            mkdir -p "$CARGO_HOME"
          fi
          target_note="clean target"
          if [[ "$CI_REUSE_TARGET" == true ]]; then
            repo="${GITHUB_REPOSITORY#*/}"
            lockhash="$( { [[ -f Cargo.lock ]] && cat Cargo.lock || find . -name Cargo.toml -not -path './target/*' | sort | xargs cat; } | sha256sum | cut -c1-16)"
            # Key: lockfile + toolchain (rustc -vV) + arch + workdir + extra env (RUSTFLAGS etc.).
            key="$( { rustc -vV; echo "$TOOLCHAIN"; uname -m; echo "$WORKDIR"; echo "$EXTRA_ENV"; echo "$lockhash"; } | sha256sum | cut -c1-16)"
            base="/cache/target/$repo"; dir="$base/$key"
            mkdir -p "$base"
            # Keep the volume small (the VM disk is limited): drop target dirs idle for 7 days and keep only the
            # 2 most recently used per repo. A dir still locked by a running job is never touched.
            { find "$base" -mindepth 1 -maxdepth 1 -type d -mtime +7; { ls -1dt "$base"/*/ 2>/dev/null || true; } | sed "s:/$::" | tail -n +3; } | sort -u | while IFS= read -r old; do
              [[ "$old" == "$dir" ]] && continue
              ( flock -n 8 || exit 0; rm -rf "$old" "$old.lock" ) 8>"$old.lock" || true
            done
            # Disk guard (the 73 GB VM filled up on 2026-11-02): under 15 GB free, drop every other idle target
            # dir (all repos); under 8 GB, skip the persistent target and build clean in $RUNNER_TEMP.
            free_gb() { df --output=avail -BG /cache | tail -1 | tr -dc 0-9; }
            if (( $(free_gb) < 15 )); then
              echo "::warning::/cache disk low ($(free_gb) GB free): pruning idle target dirs of all repos"
              # shellcheck disable=SC2094  # lock the dir's .lock file, then delete it (same pattern as above)
              for old in /cache/target/*/*/; do
                old="${old%/}"; [[ "$old" == "$dir" ]] && continue
                ( flock -n 8 || exit 0; rm -rf "$old" "$old.lock" ) 8>"$old.lock" || true
              done
            fi
            low_disk=false; (( $(free_gb) < 8 )) && low_disk=true
            # One job at a time per target dir: a second concurrent job (same key) gets a private clean dir.
            exec 9>"$dir.lock"
            if [[ "$low_disk" == true ]]; then
              echo "::warning::/cache disk still low ($(free_gb) GB free): building with a clean target"
              target_note="clean target (low disk)"
            elif flock -n 9; then
              mkdir -p "$dir"; export CARGO_TARGET_DIR="$dir"; target_note="persistent target $key"
              if command -v sccache >/dev/null; then
                # Compiled dependencies are also cached by content (survives lockfile changes). Optional.
                # The VM runners share localhost (host networking): one server port per runner, and never
                # --stop-server (it would kill the other runner's server).
                export SCCACHE_DIR=/cache/sccache SCCACHE_CACHE_SIZE=4G   # small: the persistent target does most of the work
                export SCCACHE_SERVER_PORT=$((4300 + $(printf '%s' "${RUNNER_NAME:-x}" | cksum | cut -d' ' -f1) % 100))
                if sccache --start-server >/dev/null 2>&1 && sccache --show-stats >/dev/null 2>&1; then export RUSTC_WRAPPER=sccache; fi
              fi
            else
              echo "::notice::target dir $key is in use by another job: using a private clean target dir"
              target_note="private clean target (key locked by another job)"
            fi
          fi
          # Clean builds compile into the job's temp dir, which the runner wipes after the job: a release
          # build's target/ (~10 GB for api) must not stay in the workspace and fill the runner's disk.
          if [[ -z "${CARGO_TARGET_DIR:-}" ]]; then
            export CARGO_TARGET_DIR="$RUNNER_TEMP/target"; target_note="$target_note, in \$RUNNER_TEMP"
          fi
          echo "target: $target_note"
          echo "### $target_note" >> "$GITHUB_STEP_SUMMARY"
          # sccache is an optimisation only: if it breaks a compile, retry that command without it.
          run() {
            if [[ "${RUSTC_WRAPPER:-}" != sccache ]]; then "$@"; return; fi
            local rc=0
            set +e
            "$@" 2>&1 | tee "$RUNNER_TEMP/cargo-out.log"
            rc="${PIPESTATUS[0]}"
            set -e
            if [[ "$rc" -ne 0 ]] && grep -q 'sccache' "$RUNNER_TEMP/cargo-out.log"; then
              echo "::warning::sccache failed, retrying without it"; unset RUSTC_WRAPPER; "$@"
            else return "$rc"; fi
          }
          echo "::group::cargo fmt"
          cargo fmt --all -- --check
          echo "::endgroup::"
          echo "::group::cargo clippy"
          read -ra cargs <<< "$CLIPPY_ARGS"
          run cargo clippy "${cargs[@]}"
          echo "::endgroup::"
          echo "::group::cargo test"
          read -ra targs <<< "$TEST_ARGS"
          # Pull requests run the fast unit tests only (the pre-push hook runs them locally too); the
          # integration tests (testcontainers) run on develop, main, release branches and tags.
          if [[ "$EVENT_NAME" == pull_request* ]]; then targs+=(--lib --bins); fi
          run cargo test "${targs[@]}"
          echo "::endgroup::"
          if [[ -n "${CARGO_TARGET_DIR:-}" ]]; then touch "$CARGO_TARGET_DIR"; fi
          if [[ "${RUSTC_WRAPPER:-}" == sccache ]]; then sccache --show-stats | tail -8; fi
      - name: Summary
        if: inputs.description != ''
        env:
          TITLE: ${{ inputs.image-name || github.repository }}
          DESCRIPTION: ${{ inputs.description }}
        run: printf '### %s\n\n%s\n' "$TITLE" "$DESCRIPTION" >> "$GITHUB_STEP_SUMMARY"

  fmt:
    name: ${{ inputs.image-name || 'rust' }} / fmt
    needs: verified
    if: ${{ !cancelled() && needs.verified.outputs.done != 'true' && (inputs.runs-on == 'ubuntu-latest' && (vars.CI_RUNNER == '' || vars.CI_RUNNER == 'github')) }}
    runs-on: ${{ (inputs.runs-on == 'ubuntu-latest' && ((vars.CI_RUNNER != 'github' && vars.CI_RUNNER) || 'ubuntu-latest')) || (startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on)) || inputs.runs-on }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ inputs.toolchain }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: ${{ inputs.image-name || 'rust' }} / clippy
    needs: verified
    if: ${{ !cancelled() && needs.verified.outputs.done != 'true' && (inputs.runs-on == 'ubuntu-latest' && (vars.CI_RUNNER == '' || vars.CI_RUNNER == 'github')) }}
    runs-on: ${{ (inputs.runs-on == 'ubuntu-latest' && ((vars.CI_RUNNER != 'github' && vars.CI_RUNNER) || 'ubuntu-latest')) || (startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on)) || inputs.runs-on }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare environment
        env:
          SYSTEM_PACKAGES: ${{ inputs.system-packages }}
          EXTRA_ENV: ${{ inputs.env }}
          DEPS_TOKEN: ${{ secrets.private-deps-token }}
        run: |
          set -euo pipefail
          if [[ -n "$SYSTEM_PACKAGES" ]]; then
            SUDO=""; if command -v sudo >/dev/null && [ "$(id -u)" != 0 ]; then SUDO=sudo; fi
            $SUDO apt-get update -qq
            read -ra packages <<< "$SYSTEM_PACKAGES"
            $SUDO apt-get install -y -qq --no-install-recommends "${packages[@]}"
          fi
          jq -r 'to_entries[] | "\(.key)<<__ENV_EOF__\n\(.value)\n__ENV_EOF__"' <<< "$EXTRA_ENV" >> "$GITHUB_ENV"
          if [[ -n "$DEPS_TOKEN" ]]; then
            git config --global url."https://x-access-token:${DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
            git config --global --add url."https://x-access-token:${DEPS_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
            echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
          fi
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ inputs.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ inputs.working-directory }}
          shared-key: clippy
      - name: cargo clippy
        env:
          CLIPPY_ARGS: ${{ inputs.clippy-args }}
        run: |
          read -ra args <<< "$CLIPPY_ARGS"
          cargo clippy "${args[@]}"

  test:
    name: ${{ inputs.image-name || 'rust' }} / test
    needs: verified
    if: ${{ !cancelled() && needs.verified.outputs.done != 'true' && (inputs.runs-on == 'ubuntu-latest' && (vars.CI_RUNNER == '' || vars.CI_RUNNER == 'github')) }}
    runs-on: ${{ (inputs.runs-on == 'ubuntu-latest' && ((vars.CI_RUNNER != 'github' && vars.CI_RUNNER) || 'ubuntu-latest')) || (startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on)) || inputs.runs-on }}
    services: ${{ fromJSON(inputs.services) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare environment
        env:
          SYSTEM_PACKAGES: ${{ inputs.system-packages }}
          EXTRA_ENV: ${{ inputs.env }}
          DEPS_TOKEN: ${{ secrets.private-deps-token }}
        run: |
          set -euo pipefail
          if [[ -n "$SYSTEM_PACKAGES" ]]; then
            SUDO=""; if command -v sudo >/dev/null && [ "$(id -u)" != 0 ]; then SUDO=sudo; fi
            $SUDO apt-get update -qq
            read -ra packages <<< "$SYSTEM_PACKAGES"
            $SUDO apt-get install -y -qq --no-install-recommends "${packages[@]}"
          fi
          jq -r 'to_entries[] | "\(.key)<<__ENV_EOF__\n\(.value)\n__ENV_EOF__"' <<< "$EXTRA_ENV" >> "$GITHUB_ENV"
          if [[ -n "$DEPS_TOKEN" ]]; then
            git config --global url."https://x-access-token:${DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
            git config --global --add url."https://x-access-token:${DEPS_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
            echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
          fi
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ inputs.toolchain }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ inputs.working-directory }}
          shared-key: test
      - name: cargo test
        env:
          TEST_ARGS: ${{ inputs.test-args }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          read -ra args <<< "$TEST_ARGS"
          # Pull requests run the fast unit tests only (the pre-push hook runs them locally too); the
          # integration tests (testcontainers) run on develop, main, release branches and tags.
          if [[ "$EVENT_NAME" == pull_request* ]]; then args+=(--lib --bins); fi
          cargo test "${args[@]}"
      - name: Summary
        if: inputs.description != ''
        env:
          TITLE: ${{ inputs.image-name || github.repository }}
          DESCRIPTION: ${{ inputs.description }}
        run: printf '### %s\n\n%s\n' "$TITLE" "$DESCRIPTION" >> "$GITHUB_STEP_SUMMARY"

  audit:
    name: ${{ inputs.image-name || 'rust' }} / audit
    # Not on pull requests: audited on develop, main, tags and the weekly schedule.
    if: inputs.audit && github.event_name != 'pull_request'
    runs-on: ${{ (inputs.runs-on == 'ubuntu-latest' && ((vars.CI_RUNNER != 'github' && vars.CI_RUNNER) || 'ubuntu-latest')) || (startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on)) || inputs.runs-on }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: CI cache policy
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CI_CACHE: ${{ vars.CI_CACHE }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          on=true
          if [[ "$RUNNER_ENVIRONMENT" != self-hosted || ! -w /cache || "${CI_CACHE,,}" == off || "$EVENT" == schedule ]]              || jq -e 'index("ci-no-cache")' >/dev/null <<< "${LABELS:-[]}"; then on=false; fi
          echo "CI_CACHE_ON=$on" >> "$GITHUB_ENV"
          if [[ "$RUNNER_ENVIRONMENT" == self-hosted && "$on" == true ]]; then echo "CARGO_HOME=/cache/cargo" >> "$GITHUB_ENV"
          elif [[ "$RUNNER_ENVIRONMENT" == self-hosted ]]; then
            echo "CARGO_HOME=$RUNNER_TEMP/cargo-home" >> "$GITHUB_ENV"; echo "RUSTUP_HOME=$RUNNER_TEMP/rustup-home" >> "$GITHUB_ENV"
          fi
      # Toolchain baked into the self-hosted runner image (skipped when CI_CACHE is off or on hosted runners).
      - name: Toolchain from the runner image
        id: tc
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          set -euo pipefail
          if [[ "$CI_CACHE_ON" == true ]] && command -v rustup >/dev/null &&
             rustup toolchain list | grep -qE "^${TOOLCHAIN//./\\.}(-|$)"; then
            rustup default "$TOOLCHAIN"; echo "have=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        if: steps.tc.outputs.have != 'true'
        with:
          toolchain: ${{ inputs.toolchain }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit
      - name: cargo audit
        env:
          AUDIT_ARGS: ${{ inputs.audit-args }}
        run: |
          [[ -f Cargo.lock ]] || cargo generate-lockfile
          read -ra args <<< "$AUDIT_ARGS"
          cargo audit "${args[@]}"
