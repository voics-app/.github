# Reusable Node checks: pnpm install (frozen lockfile), lint, typecheck, test
# and pnpm audit. On self-hosted runners Node, corepack/pnpm and the pnpm store come from the runner image and
# the /cache volume (CI_CACHE=off or the PR label `ci-no-cache` turns that off; see ADR-0022). Set a script input to "" to skip that step.
# GitHub Packages (npm.pkg.github.com) is configured for the `npm-scope`
# scope, so private @discordy-voics packages such as the contracts package
# resolve with the job token or `private-deps-token`.
name: node

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory that contains package.json and pnpm-lock.yaml."
        required: false
        type: string
        default: "."
      node-version:
        description: "Node.js version."
        required: false
        type: string
        default: "24"
      pnpm-version:
        description: "pnpm version, used only when package.json has no `packageManager` field."
        required: false
        type: string
        default: "10"
      npm-scope:
        description: "npm scope served from GitHub Packages."
        required: false
        type: string
        default: "@discordy-voics"
      lint-script:
        description: "package.json script for linting (empty to skip)."
        required: false
        type: string
        default: "lint"
      typecheck-script:
        description: "package.json script for type checking (empty to skip)."
        required: false
        type: string
        default: "typecheck"
      test-script:
        description: "package.json script for tests (empty to skip)."
        required: false
        type: string
        default: "test"
      audit:
        description: "Run `pnpm audit` on production dependencies."
        required: false
        type: boolean
        default: true
      audit-level:
        description: "Minimum advisory severity that fails `pnpm audit` (low, moderate, high, critical)."
        required: false
        type: string
        default: "critical"
      system-packages:
        description: "Space separated apt packages to install first (e.g. `xvfb` for Electron tests)."
        required: false
        type: string
        default: ""
      services:
        description: "JSON object of service containers (same shape as `jobs.<id>.services`)."
        required: false
        type: string
        default: "{}"
      env:
        description: "JSON object of extra environment variables."
        required: false
        type: string
        default: "{}"
      image-name:
        description: "Optional name shown in job titles (keeps the call signature uniform with docker.yml)."
        required: false
        type: string
        default: ""
      description:
        description: "Optional description written to the job summary."
        required: false
        type: string
        default: ""
      runs-on:
        description: 'Runner label, or a JSON array of labels such as `["self-hosted","discordy"]`. The default (ubuntu-latest) follows the caller repo variable CI_RUNNER when set (scripts/pc-runner.sh).'
        required: false
        type: string
        default: "ubuntu-latest"
    secrets:
      private-deps-token:
        description: "Optional token with read access to private discordy-voics repos and packages. Defaults to the job token."
        required: false

permissions:
  contents: read
  packages: read

jobs:
  # Tag builds: a vX.Y.Z tag points at the merge commit that main's CI already built and tested in full (clean,
  # ADR-0022). When that run is green, the checks are not repeated (the image job still builds and publishes the
  # version). No green main run for this commit (or the lookup fails) -> the checks run as usual.
  verified:
    name: ${{ inputs.image-name || 'node' }} / already verified on main
    if: github.ref_type == 'tag'
    runs-on: ${{ (inputs.runs-on == 'ubuntu-latest' && ((vars.CI_RUNNER != 'github' && vars.CI_RUNNER) || 'ubuntu-latest')) || (startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on)) || inputs.runs-on }}
    permissions:
      actions: read
      contents: read
    outputs:
      done: ${{ steps.lookup.outputs.done }}
    steps:
      - id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -uo pipefail
          wf="${WORKFLOW_REF%@*}"; wf="${wf##*/}"
          # curl + jq (both on the self-hosted image and GitHub-hosted runners; gh is not in the runner image).
          url="${GITHUB_API_URL:-https://api.github.com}/repos/$REPO/actions/workflows/$wf/runs?head_sha=$SHA&branch=main&event=push&status=success&per_page=1"
          code="$(curl -sS -o "$RUNNER_TEMP/main-runs.json" -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$url" || echo 000)"
          run=""
          if [[ "$code" == 200 ]]; then run="$(jq -r '.workflow_runs[0].html_url // empty' "$RUNNER_TEMP/main-runs.json" 2>/dev/null || true)"
          else echo "::warning::lookup of the main run failed (HTTP $code): running the checks"; fi
          if [[ -n "$run" ]]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "### Checks skipped: commit $SHA already passed in full on main ($run)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
            echo "No green main run for $SHA: running the checks"
          fi

  checks:
    name: ${{ inputs.image-name || 'node' }} / checks
    needs: verified
    if: ${{ !cancelled() && needs.verified.outputs.done != 'true' }}
    runs-on: ${{ (inputs.runs-on == 'ubuntu-latest' && ((vars.CI_RUNNER != 'github' && vars.CI_RUNNER) || 'ubuntu-latest')) || (startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on)) || inputs.runs-on }}
    services: ${{ fromJSON(inputs.services) }}
    permissions:
      contents: read
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.private-deps-token || github.token }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: CI cache policy
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CI_CACHE: ${{ vars.CI_CACHE }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          on=true; why="persistent cache on"
          if [[ "$RUNNER_ENVIRONMENT" != self-hosted ]]; then on=false; why="GitHub-hosted runner"
          elif [[ ! -d /cache || ! -w /cache ]]; then on=false; why="no writable /cache volume"
          elif [[ "${CI_CACHE,,}" == off ]]; then on=false; why="CI_CACHE=off"
          elif jq -e 'index("ci-no-cache")' >/dev/null <<< "${LABELS:-[]}"; then on=false; why="PR label ci-no-cache"
          elif [[ "$EVENT" == schedule ]]; then on=false; why="scheduled cold build"
          fi
          echo "CI_CACHE_ON=$on" >> "$GITHUB_ENV"
          echo "CI cache: on=$on ($why)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Prepare environment
        id: prepare
        env:
          SYSTEM_PACKAGES: ${{ inputs.system-packages }}
          EXTRA_ENV: ${{ inputs.env }}
          DEPS_TOKEN: ${{ secrets.private-deps-token }}
          PNPM_VERSION: ${{ inputs.pnpm-version }}
        run: |
          set -euo pipefail
          if [[ -n "$SYSTEM_PACKAGES" ]]; then
            SUDO=""; if command -v sudo >/dev/null && [ "$(id -u)" != 0 ]; then SUDO=sudo; fi
            $SUDO apt-get update -qq
            read -ra packages <<< "$SYSTEM_PACKAGES"
            $SUDO apt-get install -y -qq --no-install-recommends "${packages[@]}"
          fi
          jq -r 'to_entries[] | "\(.key)<<__ENV_EOF__\n\(.value)\n__ENV_EOF__"' <<< "$EXTRA_ENV" >> "$GITHUB_ENV"
          if [[ -n "$DEPS_TOKEN" ]]; then
            git config --global url."https://x-access-token:${DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
            git config --global --add url."https://x-access-token:${DEPS_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          fi
          # pnpm/action-setup refuses an explicit version when package.json pins packageManager.
          if [[ -n "$(jq -r '.packageManager // empty' package.json)" ]]; then
            echo "pnpm-version=" >> "$GITHUB_OUTPUT"
          else
            echo "pnpm-version=${PNPM_VERSION}" >> "$GITHUB_OUTPUT"
          fi
      # Node (latest of the major) and corepack are baked into the self-hosted runner image; the pnpm store and
      # corepack downloads live on the /cache volume. Skipped when CI_CACHE is off (clean install like hosted).
      - name: Node and pnpm from the runner image
        id: node
        env:
          NODE_VERSION: ${{ inputs.node-version }}
          PNPM_VERSION: ${{ steps.prepare.outputs.pnpm-version }}
          NPM_SCOPE: ${{ inputs.npm-scope }}
        run: |
          set -euo pipefail
          if [[ "$CI_CACHE_ON" == true && "$NODE_VERSION" =~ ^[0-9]+$ && -x "/opt/node/$NODE_VERSION/bin/node" ]]; then
            export PATH="/opt/node/$NODE_VERSION/bin:$PATH"
            export COREPACK_HOME=/cache/corepack COREPACK_ENABLE_DOWNLOAD_PROMPT=0
            # The pnpm store lives in the runner's work-dir mount, next to the checkout: on /cache (another mount in
            # the container) pnpm cannot hardlink and copies every file (measured 15.4 s vs 2.8 s per install).
            store="$(dirname "$RUNNER_WORKSPACE")/.pnpm-store"
            mkdir -p "$COREPACK_HOME" "$store" "$RUNNER_TEMP/corepack-bin"
            corepack enable --install-directory "$RUNNER_TEMP/corepack-bin" pnpm
            if [[ -n "$PNPM_VERSION" ]]; then corepack prepare "pnpm@$PNPM_VERSION" --activate; fi
            # What actions/setup-node would write for registry-url + scope.
            printf '%s\n' "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}" "$NPM_SCOPE:registry=https://npm.pkg.github.com" "always-auth=true" > "$RUNNER_TEMP/.npmrc"
            {
              echo "/opt/node/$NODE_VERSION/bin"
              echo "$RUNNER_TEMP/corepack-bin"
            } >> "$GITHUB_PATH"
            {
              echo "COREPACK_HOME=/cache/corepack"
              echo "COREPACK_ENABLE_DOWNLOAD_PROMPT=0"
              echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/.npmrc"
              echo "npm_config_store_dir=$store"
            } >> "$GITHUB_ENV"
            echo "have=true" >> "$GITHUB_OUTPUT"
            node --version
          fi
      # GitHub-hosted only: pnpm/action-setup installs pnpm with the runner's bundled npm. On self-hosted runners that
      # npm breaks when the runner auto-updates itself (2.338.0 -> 2.338.2 left externals/node24/bin/npm unable to
      # find ../lib/cli.js), so a self-hosted cold run gets pnpm through corepack of the fresh Node below instead.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.node.outputs.have != 'true' && runner.environment != 'self-hosted'
        with:
          version: ${{ steps.prepare.outputs.pnpm-version }}
          package_json_file: ${{ inputs.working-directory }}/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.node.outputs.have != 'true'
        with:
          node-version: ${{ inputs.node-version }}
          # The Actions cache is only for GitHub-hosted runners; a self-hosted cold build starts from nothing.
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com
          scope: ${{ inputs.npm-scope }}
      - name: pnpm through corepack (self-hosted cold run)
        if: steps.node.outputs.have != 'true' && runner.environment == 'self-hosted'
        env:
          PNPM_VERSION: ${{ steps.prepare.outputs.pnpm-version }}
        run: |
          set -euo pipefail
          # Everything in $RUNNER_TEMP: a cold run must not reuse the image or the /cache volume.
          export COREPACK_HOME="$RUNNER_TEMP/corepack" COREPACK_ENABLE_DOWNLOAD_PROMPT=0
          mkdir -p "$COREPACK_HOME" "$RUNNER_TEMP/corepack-bin"
          command -v corepack >/dev/null || npm install -g corepack   # Node 25+ no longer bundles corepack
          corepack enable --install-directory "$RUNNER_TEMP/corepack-bin" pnpm
          if [[ -n "$PNPM_VERSION" ]]; then corepack prepare "pnpm@$PNPM_VERSION" --activate; fi
          echo "$RUNNER_TEMP/corepack-bin" >> "$GITHUB_PATH"
          { echo "COREPACK_HOME=$COREPACK_HOME"; echo "COREPACK_ENABLE_DOWNLOAD_PROMPT=0"; echo "npm_config_store_dir=$RUNNER_TEMP/pnpm-store"; } >> "$GITHUB_ENV"
          "$RUNNER_TEMP/corepack-bin/pnpm" --version
      - name: Install dependencies
        run: |
          if [[ "$CI_CACHE_ON" == true ]]; then pnpm install --frozen-lockfile --prefer-offline; else pnpm install --frozen-lockfile; fi
      - name: Lint
        if: inputs.lint-script != ''
        env:
          SCRIPT: ${{ inputs.lint-script }}
        run: pnpm run "$SCRIPT"
      - name: Typecheck
        if: inputs.typecheck-script != ''
        env:
          SCRIPT: ${{ inputs.typecheck-script }}
        run: pnpm run "$SCRIPT"
      - name: Test
        if: inputs.test-script != ''
        env:
          SCRIPT: ${{ inputs.test-script }}
        run: pnpm run "$SCRIPT"
      - name: Audit
        if: inputs.audit && github.event_name != 'pull_request'
        env:
          AUDIT_LEVEL: ${{ inputs.audit-level }}
        run: pnpm audit --prod --audit-level "$AUDIT_LEVEL"
      - name: Summary
        if: inputs.description != ''
        env:
          TITLE: ${{ inputs.image-name || github.repository }}
          DESCRIPTION: ${{ inputs.description }}
        run: printf '### %s\n\n%s\n' "$TITLE" "$DESCRIPTION" >> "$GITHUB_STEP_SUMMARY"
